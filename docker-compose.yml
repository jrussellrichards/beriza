services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acredita
      POSTGRES_PASSWORD: acredita
      POSTGRES_DB: acredita
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://acredita:acredita@db:5432/acredita
      - REDIS_URL=redis://redis:6379/0
      # Los datos de demo son opt-in: en producción no se cargan ni con esto
      # puesto, pero en local es lo que hace que las pantallas no salgan vacías.
      - SEED_DEMO=true
      # Los archivos de desarrollo van a disco, NUNCA al bucket real. El .env de
      # esta máquina trae FILE_STORAGE=s3 con las credenciales de producción, así
      # que sin esta línea cada documento subido en local aterrizaba en el bucket
      # `berisa` de producción. Se declara acá —y no sólo en el .env— para que la
      # separación entre entornos esté versionada y no dependa de un archivo local.
      - FILE_STORAGE=local
      - LOCAL_STORAGE_PATH=uploads
      # El frontend de este compose se publica en 3001, no en 3000. Sin esto los
      # enlaces de invitación y de recuperación del email salían apuntando al
      # puerto equivocado y había que corregirlos a mano en el navegador.
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://acredita:acredita@db:5432/acredita
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    volumes:
      # Sin esto el código va HORNEADO en la imagen (el Dockerfile hace COPY . .),
      # así que el contenedor seguía sirviendo lo que hubiera al construirla: los
      # cambios del editor no llegaban, `next dev` no recargaba nada, y un
      # `tsc --noEmit` adentro validaba código viejo dando falsa tranquilidad.
      # El volumen anónimo de node_modules evita que el bind mount del host —que
      # no las tiene— tape las dependencias instaladas en la imagen.
      - ./frontend:/app
      - /app/node_modules
    environment:
      # El proxy de app/api/[...path]/route.ts cae por defecto a
      # http://localhost:8000, que DENTRO de este contenedor es este mismo
      # contenedor: sin esta variable toda llamada a la API respondia 500 y el
      # frontend en :3001 se veia en blanco. El backend se alcanza por el nombre
      # del servicio en la red de compose.
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
