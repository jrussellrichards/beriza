[pytest]
testpaths = tests
# Los tests nacieron como scripts (`python tests/test_x.py`) y su punto de
# entrada es run(), que pytest no recolecta. Cada archivo expone ademas un
# envoltorio test_<modulo>() para que la suite corra completa con un comando.
python_files = test_*.py
python_functions = test_*
addopts = -q --no-header
