name: berisa-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: cd frontend && npm install

      # Guard del sistema de diseño: los componentes deben nombrar el SIGNIFICADO
      # del color (bg-bloqueo-soft), no el color (bg-red-50). Sin esto la deriva
      # vuelve sola: se llegó a tener 1552 utilidades crudas y SIETE mapas
      # distintos del mismo estilo de estado. La lista de utilidades incluye
      # ring y divide porque `focus:ring-slate-900/10` se coló 43 veces
      # mientras el guard solo miraba bg|text|border.
      - name: Sin colores crudos en el frontend
        run: |
          cd frontend
          if grep -rEn "(bg|text|border|ring|divide|fill|stroke|from|via|to|outline|placeholder|caret|accent|shadow)-(slate|gray|zinc|neutral|stone|amber|yellow|orange|red|emerald|green|teal|cyan|blue|indigo|violet|purple|fuchsia|pink|rose)-[0-9]+" src/ ; then
            echo "::error::Usa tokens semánticos del sistema de diseño, no utilidades de color de Tailwind. Ver src/app/globals.css"
            exit 1
          fi
          echo "OK: cero utilidades de color crudas"

      # Complemento del guard anterior: aquel prohíbe los colores CRUDOS, este
      # exige que los semánticos EXISTAN. Hicieron falta los dos: la migración
      # dejó 23 clases `bg-ok-soft0` / `bg-surface-app0` —un reemplazo que hizo
      # match dentro de `emerald-500` y dejó el 0 colgando— que parecían
      # correctas y no pintaban nada. Tailwind no falla ante una clase
      # desconocida, simplemente no genera la regla.
      - name: Los tokens de color usados existen
        run: cd frontend && node scripts/validar-tokens.mjs

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acredita
          POSTGRES_PASSWORD: acredita
          POSTGRES_DB: acredita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://acredita:acredita@localhost:5432/acredita_test
      JWT_SECRET: ci-test-secret
      # Sin esto el seed solo cargaría el catálogo y la prueba de idempotencia
      # no ejercitaría nada. En producción el guard lo ignora igual.
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Alembic upgrade head (migraciones contra Postgres real)
        run: cd backend && alembic upgrade head

      - name: Seed idempotente (dos corridas)
        run: cd backend && python scripts/seed.py && python scripts/seed.py

      - name: Smoke tests (autorización, flujo de expediente, vencimientos, reutilización, portal, nómina, limpieza, centros, perfiles)
        run: cd backend && python tests/test_tenant.py && python tests/test_expediente_flujo.py && python tests/test_vencimiento.py && python tests/test_reutilizacion.py && python tests/test_vista_documental.py && python tests/test_portal_contratista.py && python tests/test_invitar_mandante.py && python tests/test_permisos_pilar.py && python tests/test_nomina.py && python tests/test_limpieza.py && python tests/test_centro_trabajo.py && python tests/test_perfiles.py

  deploy-prod:
    needs: [build, backend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ENV_FILE
          script: |
            set -e

            # init+fetch+reset funciona aunque el directorio exista con archivos
            # (git clone falla si no está vacío — bug que rompía el bootstrap)
            mkdir -p /root/acredita
            cd /root/acredita
            if [ ! -d .git ]; then
              git init -q
              git remote add origin https://github.com/jrussellrichards/beriza.git
            fi
            git fetch origin main
            git reset --hard origin/main

            # Escribir .env desde GitHub Secret (después del reset)
            echo "$ENV_FILE" > /root/acredita/.env

            docker compose -f docker-compose.prod.yml --env-file .env up --build -d
            sleep 8
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            docker compose -f docker-compose.prod.yml exec -T backend python scripts/seed.py
        env:
          ENV_FILE: ${{ secrets.ENV }}
